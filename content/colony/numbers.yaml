# Every tunable number of the colony's rules (src/game/colony/). Read by
# src/game/colony/numbers.ts, validated by its Zod schema, and compiled into
# src/game/colony/numbers.json by `npm run content`.
#
# ALL OF IT IS TUNED, NONE OF IT IS SOURCED. The history (Jamestown, Quebec,
# Plymouth) is from memory and unchecked (docs/SPEC.md). Measured: docs/KILLGATE.md.
# Units: a turn is half a year; food is one person's ration for one turn;
# powder is kegs; a fraction may be written "1/14".
#
# Ported 2026-11-28 from prototypes/killgate/data.js (kill gate round 4b). The
# formulas the prototype wrote as functions are written here as their numbers;
# formulas.ts holds the arithmetic, in the prototype's order so the port is exact.
# Dropped in the port, because nothing read them: allyAbove, allyHelp, allyCorn
# (replaced by the support rule), specPrice (replaced by price.spec), mutinyBelow
# and mutiny (the one-number mutiny, replaced by the factions in round 4).

life: 60            # turns the governor may hold office before he lays it down
after: 20           # turns the colony must stand without him: the win is ten years
firstTen: 20        # the first-playable window, and the "first ten years" the author named
minPop: 12          # below this the colony is dead

start: { lab: 34, craft: 6, sold: 10, gent: 12, fam: 0, food: 150, powder: 22, iron: 10, salt: 8, goods: 14, morale: 60, favour: 55 }

# ---- work: per hand set to a job for a summer -------------------------------------------
foodPerHand: 3.4                     # times the fields, the land known, the weather, the tools
fieldMult: { base: 1, perLevel: 0.09 }   # fields 0..10: at 0 the year's food takes two hands in three
fieldCost: { base: 8, perLevel: 3 }      # build points for the next level of fields
storeCost: 22
storeMax: 3
millCost: 170                        # the powder mill: late, dear, and it ends the clock
millCraft: 6
millKegs: 5
wallPerHand: 0.085
wallDecay: 0.06
wallMax: 10
cargoPerHand: 1.6
rangePerHand: 0.05                   # the country ranged, 0..1: better furs, better hunting, a truer reckoning
ironUsePerHand: 0.035                # tools wear; short of iron, every job slows
ironShortPenalty: 0.45
spoil: 0.28
spoilSalted: 0.06
saltPerFood: 0.035
storeSpoilCut: 0.2
harassPenalty: 0.35                  # field and cargo work lost under a hostile nation, with no watch

# ---- winter ---------------------------------------------------------------------------
