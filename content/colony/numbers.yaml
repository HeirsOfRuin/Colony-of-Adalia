  company: { late: 0.16, short: 0.12, lost: 0.07 }
  crown: { late: 0.34, short: 0.10, lost: 0.07 }
budget:                              # the backers' purse a year: base + perFavour x favour
  company: { base: 22, perFavour: 0.4 }
  crown: { base: 24, perFavour: 0.16 }
sails:                               # the chance the backers send a ship: min(cap, base + perFavour x favour)
